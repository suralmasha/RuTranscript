name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v2.1.0
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          python -m pip install poetry==2.2.1
          test "v$(poetry version -s)" = "$RELEASE_TAG"
          poetry build

      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/RuTranscript
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
