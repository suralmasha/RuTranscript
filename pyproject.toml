[build-system]
requires = ['poetry-core==2.2.1']
build-backend = 'poetry.core.masonry.api'

[tool.poetry]
package-mode = true
packages = [{ include = 'ru_transcript', from = 'src' }]

[project]
name = 'RuTranscript'
version = '2.2.0'
description = 'A tool for phonetic transcription in russian'
authors = [
    { name = 'Alexandra Badasyan', email = 'sashabadasyan@icloud.com' },
]
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.11,<3.13'
keywords = ['russian', 'phonetics', 'transcription', 'ipa', 'nlp']
classifiers = [
    'Natural Language :: Russian',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Topic :: Text Processing :: Linguistic',
]
dependencies = [
    'epitran==1.35.1',
    'nltk==3.9.4',
    'num2words==0.5.14',
    'numpy==1.26.4',
    'onnxruntime==1.25.1',
    'pymorphy3==2.0.6',
    'rutranscript-resources>=1.0.0,<1.1.0',
    'setuptools==80.9.0',
    'spacy==3.8.14',
]

[project.urls]
Repository = 'https://github.com/suralmasha/RuTranscript'
Issues = 'https://github.com/suralmasha/RuTranscript/issues'

[tool.poetry.dependencies]
rutranscript-resources = { path = 'resources', develop = true }

[dependency-groups]
test = ['tqdm==4.67.3']
dev = ['ruff==0.15.12', 'pre-commit==4.6.0']

[tool.ruff]
line-length = 120
exclude = ['**/tests/**', 'src/ru_transcript/data_constants.py']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['F', 'E', 'W', 'I', 'N', 'D', 'UP', 'YTT', 'ANN', 'ASYNC', 'S', 'B', 'A', 'COM', 'C4', 'ISC', 'ICN', 'LOG',
    'G', 'INP', 'PIE', 'T20', 'PYI', 'Q', 'RSE', 'RET', 'SLF', 'SIM', 'TID', 'TC', 'INT', 'ARG', 'PTH', 'PD', 'PL',
    'TRY', 'FLY', 'NPY', 'FAST', 'PERF', 'FURB', 'RUF']
ignore = ['D100', 'D104', 'COM812', 'RUF001', 'RUF002', 'RUF003']

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
