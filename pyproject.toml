[build-system]
requires = ['poetry-core==2.2.1']
build-backend = 'poetry.core.masonry.api'

[tool.poetry]
package-mode = true
packages = [{ include = 'ru_transcript', from = 'src' }]

[project]
name = 'RuTranscript'
version = '2.0.1'
description = 'A tool for phonetic transcription in russian'
authors = [
    { name = 'Alexandra Badasyan', email = 'sashabadasyan@icloud.com' },
]
readme = 'README.md'
requires-python = '==3.12.*'
dynamic = ['dependencies']

[tool.poetry.dependencies]
spacy = '3.8.14'
numpy = '1.26.4'
nltk = '3.9.4'
epitran = '1.35.1'
openpyxl = '3.1.5'
onnxruntime = '1.25.1'
setuptools = '80.9.0'
ru-core-news-sm = { url = 'https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl' }
tps = { git = 'https://github.com/sovaai/sova-tts-tps.git', tag = 'v1.2.0' }
stressrnn = { git = 'https://github.com/Desklop/StressRNN.git' }
num2t4ru = { git = 'https://github.com/seriyps/ru_number_to_text.git' }

[dependency-groups]
test = ['tqdm==4.67.3']
dev = ['ruff==0.15.12', 'pre-commit==4.6.0']

[tool.ruff]
line-length = 120
exclude = ['**/tests/**']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['F', 'E', 'W', 'I', 'N', 'D', 'UP', 'YTT', 'ANN', 'ASYNC', 'S', 'B', 'A', 'COM', 'C4', 'ISC', 'ICN', 'LOG',
    'G', 'INP', 'PIE', 'T20', 'PYI', 'Q', 'RSE', 'RET', 'SLF', 'SIM', 'TID', 'TC', 'INT', 'ARG', 'PTH', 'PD', 'PL',
    'TRY', 'FLY', 'NPY', 'FAST', 'PERF', 'FURB', 'RUF']
ignore = ['D100', 'D104', 'COM812', 'RUF001', 'RUF002', 'RUF003']

[tool.ruff.lint.pydocstyle]
convention = 'pep257'

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
